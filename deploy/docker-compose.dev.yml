# Development override: publishes the infrastructure ports on 127.0.0.1 so
# services running natively on your machine (uvicorn --reload, dotnet watch)
# can reach Postgres, RabbitMQ and Redis. Used by `make infra`; never in production.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
