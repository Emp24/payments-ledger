# Run from the repo root via the Makefile (`make up`), which passes --env-file .env.
name: payments-ledger

x-python-healthcheck: &python-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  gateway:
    build: ../services/gateway
    environment:
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:?}
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:?}
      GATEWAY_RABBITMQ_URL: ${GATEWAY_RABBITMQ_URL:?}
      GATEWAY_LEDGER_URL: ${GATEWAY_LEDGER_URL:?}
      GATEWAY_MOCK_BANK_URL: ${GATEWAY_MOCK_BANK_URL:?}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck: *python-healthcheck
    depends_on:
      ledger: { condition: service_healthy }
      mock-bank: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  ledger:
    build: ../services/ledger
    environment:
      ConnectionStrings__Postgres: ${LEDGER_POSTGRES_CONNECTION:?}
      ConnectionStrings__RabbitMq: ${LEDGER_RABBITMQ_CONNECTION:?}
      ConnectionStrings__Redis: ${LEDGER_REDIS_CONNECTION:?}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  mock-bank:
    build: ../services/mock-bank
    healthcheck: *python-healthcheck
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      LEDGER_DB_USER: ${LEDGER_DB_USER:?}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?}
      GATEWAY_DB_USER: ${GATEWAY_DB_USER:?}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      # TCP check: the temporary server used while init scripts run listens on the
      # Unix socket only, so this passes only after the databases exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      # Management UI only, for development. AMQP (5672) stays internal.
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
